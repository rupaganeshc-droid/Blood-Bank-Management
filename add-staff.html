<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Add Staff Member</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body {
      background: linear-gradient(135deg, #74ebd5, #ACB6E5);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Poppins', sans-serif;
    }
    .form-box {
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(10px);
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 0 25px rgba(0, 0, 0, 0.3);
      width: 400px;
      color: #fff;
      animation: fadeIn 1s ease-in-out;
    }
    h2 {
      text-align: center;
      font-weight: 700;
      margin-bottom: 25px;
      color: #fff;
    }
    .form-control {
      border-radius: 10px;
      border: none;
      padding: 12px;
      margin-bottom: 15px;
      font-size: 1rem;
    }
    .btn-submit {
      background: linear-gradient(90deg, #6a11cb, #2575fc);
      border: none;
      color: white;
      padding: 12px;
      width: 100%;
      border-radius: 12px;
      font-size: 1.1rem;
      font-weight: 600;
      transition: transform 0.2s ease, box-shadow 0.3s ease;
    }
    .btn-submit:hover {
      transform: translateY(-3px);
      box-shadow: 0px 10px 20px rgba(0,0,0,0.2);
    }
    #message {
      text-align: center;
      margin-top: 15px;
      font-weight: 600;
    }
    @keyframes fadeIn {
      from {opacity: 0; transform: translateY(30px);}
      to {opacity: 1; transform: translateY(0);}
    }
  </style>
</head>
<body>
  <div class="form-box">
    <h2>Add Staff Member</h2>
    <form id="addStaffForm">
      <label for="name">Name</label>
      <input type="text" id="name" class="form-control" placeholder="Enter name" required>

      <label for="staffId">Staff ID</label>
      <input type="text" id="staffId" class="form-control" placeholder="Enter staff ID" required>

      <label for="hospitalName">Hospital Name</label>
      <input type="text" id="hospitalName" class="form-control" placeholder="Enter hospital name" required>

      <label for="addedTo">Member Added To This</label>
      <input type="text" id="addedTo" class="form-control" placeholder="Enter member added" required>

      <button type="submit" class="btn-submit">Add Member</button>
    </form>
    <div id="message"></div>
  </div>

  <script>
    document.getElementById("addStaffForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      const name = document.getElementById("name").value;
      const staffId = document.getElementById("staffId").value;
      const hospitalName = document.getElementById("hospitalName").value;
      const addedTo = document.getElementById("addedTo").value;

      try {
        const res = await fetch("http://localhost:3000/addStaff", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name, staffId, hospitalName, addedTo }),
        });

        if (!res.ok) throw new Error('Network response was not ok');
        const data = await res.json();
        const msg = document.getElementById("message");
        msg.textContent = data.message;
        msg.style.color = data.success ? "limegreen" : "orange";
      } catch (err) {
        console.error(err);
        document.getElementById("message").textContent = "Server error. Try again later.";
        document.getElementById("message").style.color = "red";
      }
    });
  </script>
</body>
</html>
