<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Staff Verification Success</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet" />
  <style>
    body {
      background: linear-gradient(135deg, #89f7fe, #66a6ff);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Poppins', sans-serif;
      color: #fff;
      overflow: hidden;
    }

    .container-box {
      background: rgba(255, 255, 255, 0.2);
      padding: 50px;
      border-radius: 20px;
      backdrop-filter: blur(10px);
      text-align: center;
      box-shadow: 0 0 25px rgba(0, 0, 0, 0.3);
      animation: fadeIn 1s ease-in-out;
    }

    h1 {
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 15px;
    }

    p {
      font-size: 1rem;
      margin-bottom: 25px;
    }

    .btn-option {
      display: block;
      width: 100%;
      margin: 10px 0;
      padding: 15px;
      font-size: 1.1rem;
      font-weight: 600;
      border: none;
      border-radius: 12px;
      color: white;
      transition: transform 0.2s ease, box-shadow 0.3s ease;
    }

    .btn-option:hover {
      transform: translateY(-3px);
      box-shadow: 0px 10px 20px rgba(0,0,0,0.25);
    }

    .btn-blood {
      background: linear-gradient(90deg, #ff416c, #ff4b2b);
    }

    .btn-staff {
      background: linear-gradient(90deg, #36d1dc, #5b86e5);
    }

    .icon {
      font-size: 3rem;
      margin-bottom: 15px;
      animation: float 3s infinite ease-in-out;
    }

    @keyframes fadeIn {
      from {opacity: 0; transform: translateY(30px);}
      to {opacity: 1; transform: translateY(0);}
    }

    @keyframes float {
      0%, 100% {transform: translateY(0);}
      50% {transform: translateY(-10px);}
    }
  </style>
</head>
<body>

  <div class="container-box">
    <i class="bi bi-shield-check icon"></i>
    <h1>Verification Successful!</h1>
    <p>Welcome to the Hospital Staff Portal</p>

    <button class="btn-option btn-blood" onclick="requestBlood()">
      <i class="bi bi-droplet-half me-2"></i>Request Blood
    </button>

    <button class="btn-option btn-staff" onclick="addStaff()">
      <i class="bi bi-person-plus me-2"></i>Add Staff Member
    </button>
  </div>

  <script>
    function requestBlood() {
      window.location.href = "Request blood.html"; // ✅ Navigates to Request Blood Page
    }

    function addStaff() {
      window.location.href = "add-staff.html"; // ✅ Navigates to Add Staff Page
    }
  </script>

</body>
</html>
