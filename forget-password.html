<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Forgot Password</title>
  <style>
    body {
      background: linear-gradient(135deg, #ff6ec4, #7873f5);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
    }

    .box {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 20px;
      padding: 40px 30px;
      width: 350px;
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      text-align: center;
    }

    .box h2 {
      margin-bottom: 10px;
      font-size: 24px;
    }

    .box p {
      font-size: 14px;
      color: #f1f1f1;
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      padding: 10px;
      margin: 10px 0 10px;
      border-radius: 10px;
      border: none;
      background: rgba(255, 255, 255, 0.2);
      color: #fff;
      font-size: 14px;
      outline: none;
      backdrop-filter: blur(5px);
    }

    input::placeholder {
      color: #ddd;
    }

    button {
      padding: 10px 25px;
      background-color: #6a00ff;
      color: white;
      border: none;
      border-radius: 20px;
      cursor: pointer;
      font-size: 15px;
      transition: 0.3s;
    }

    button:hover {
      background-color: #4b00c9;
    }
    .back-btn {
  position: absolute;
  top: 20px;
  left: 30px;
  padding: 10px 20px;
  font-size: 16px;
  background: rgba(255, 255, 255, 0.15);
  border: 1px solid rgba(255, 255, 255, 0.4);
  color: white;
  text-decoration: none;
  border-radius: 30px;
  backdrop-filter: blur(10px);
  z-index: 999;
  transition: 0.3s;
}

.back-btn:hover {
  background: rgba(255, 255, 255, 0.3);
  color: #6a00ff;
}

  </style>
</head>
<body>
    <a href="student.html" class="back-btn">← Back</a>

  <div class="box">
    <h2>Reset Password</h2>
    <p>Enter your registered email below:</p>
    <input type="email" placeholder="Your email" id="resetEmail" />
    <br />
    <button onclick="sendReset()">Send Reset Link</button>
  </div>

  <script>
    function sendReset() {
      const email = document.getElementById('resetEmail').value;
      if (email) {
        alert("Reset link sent to " + email); // Replace with backend logic
      } else {
        alert("Please enter a valid email address.");
      }
    }
  </script>
</body>
</html>
