<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Forgot Admin Password</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet" />
  <style>
    .back-btn {
  position: absolute;
  top: 20px;
  left: 30px;
  padding: 10px 20px;
  font-size: 16px;
  background: rgba(255, 255, 255, 0.15);
  border: 1px solid rgba(255, 255, 255, 0.4);
  color: white;
  text-decoration: none;
  border-radius: 30px;
  backdrop-filter: blur(10px);
  z-index: 999;
  transition: 0.3s;
}

.back-btn:hover {
  background: rgba(255, 255, 255, 0.3);
  color: #6a00ff;
}

    body {
      background: linear-gradient(135deg, #ff6ec4, #7873f5);

      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', sans-serif;
    }

    .forgot-card {
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      box-shadow: 0 0 30px rgba(0,0,0,0.2);
      padding: 40px;
      width: 100%;
      max-width: 400px;
      color: #fff;
    }

    .form-control {
      background: rgba(255,255,255,0.15);
      border: none;
      color: #fff;
    }

    .form-control::placeholder {
      color: #ddd;
    }

    .form-control:focus {
      background: rgba(255,255,255,0.25);
      box-shadow: none;
      color: #fff;
    }

    .btn-purple {
      background-color: #4b0082;
      color: white;
      border-radius: 50px;
    }

    .btn-purple:hover {
      background-color: #36006e;
    }

    h3 {
      font-weight: 600;
    }

    .back-link {
      color: #ddd;
      font-size: 0.9rem;
    }

    .back-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
    <a href="admin.html" class="back-btn">← Back</a>

  <div class="forgot-card text-center">
    <h3 class="mb-3"><i class="bi bi-envelope-fill"></i> Reset Password</h3>
    <p class="mb-4">Enter your admin email to receive a reset link.</p>
    <form>
      <div class="mb-3 text-start">
        <label class="form-label">Email address</label>
        <input type="email" class="form-control" placeholder="Enter email" required>
      </div>
      <div class="d-grid mb-2">
        <button type="submit" class="btn btn-purple">Send Reset Link</button>
      </div>
      
    </form>
  </div>
</body>
</html>
