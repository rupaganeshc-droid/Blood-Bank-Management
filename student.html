<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Student Login | Blood Bank</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      height: 100vh;
      background: linear-gradient(135deg, #f186c6, #aeacf1);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .container {
      position: relative;
      width: 900px;
      max-width: 100%;
      min-height: 500px;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(15px);
      border-radius: 25px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
      overflow: hidden;
      animation: fadeSlideIn 1s ease forwards;
      opacity: 0;
    }

    @keyframes fadeSlideIn {
      0% {
        opacity: 0;
        transform: translateY(50px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .form-container {
      position: absolute;
      top: 0;
      height: 100%;
      width: 50%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: all 0.6s ease-in-out;
      padding: 0 50px;
      text-align: center;
      color: #fff;
    }

    .sign-in-container {
      left: 0;
      z-index: 2;
    }

    .sign-up-container {
      left: 0;
      opacity: 0;
      z-index: 1;
    }

    .container.right-panel-active .sign-in-container {
      transform: translateX(100%);
      opacity: 0;
      z-index: 1;
    }

    .container.right-panel-active .sign-up-container {
      transform: translateX(100%);
      opacity: 1;
      z-index: 2;
    }

    form {
      width: 100%;
      max-width: 320px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    form h2 {
      margin-bottom: 10px;
      font-weight: bold;
    }

    input {
      padding: 12px;
      border-radius: 10px;
      border: none;
      background: rgba(255, 255, 255, 0.2);
      color: #fff;
    }

    input::placeholder {
      color: #eee;
    }

    button {
      margin-top: 10px;
      padding: 10px;
      border: none;
      border-radius: 20px;
      background-color: #6a00ff;
      color: white;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s;
    }

    button:hover {
      background-color: #a384d7;
    }

    a {
      font-size: 0.9rem;
      color: #eee;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    .overlay-container {
      position: absolute;
      top: 0;
      left: 50%;
      width: 50%;
      height: 100%;
      overflow: hidden;
      transition: transform 0.6s ease-in-out;
      z-index: 100;
    }

    .overlay {
      background: linear-gradient(135deg, #8e2de2, #9174ca);
      position: relative;
      left: -100%;
      height: 100%;
      width: 200%;
      transform: translateX(0);
      transition: transform 0.6s ease-in-out;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
    }

    .container.right-panel-active .overlay-container {
      transform: translateX(-100%);
    }

    .container.right-panel-active .overlay {
      transform: translateX(50%);
    }

    .overlay-panel {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 0 40px;
      width: 50%;
    }

    .overlay-panel h1 {
      font-size: 2rem;
      font-weight: bold;
    }

    .overlay-panel p {
      margin: 15px 0;
      font-size: 1rem;
      color: #f0f0f0;
    }

    .ghost {
      background-color: transparent;
      border: 2px solid white;
      border-radius: 20px;
      padding: 10px 25px;
      color: white;
      margin-top: 10px;
      transition: background 0.3s, color 0.3s;
    }

    .ghost:hover {
      background-color: white;
      color: #6a00ff;
    }

    @media (max-width: 768px) {
      .container {
        width: 95%;
        flex-direction: column;
        height: auto;
      }
      .form-container, .overlay-container {
        width: 100%;
        height: auto;
        position: relative;
        transform: none !important;
      }
      .overlay {
        display: none;
      }
    }

    .back-btn {
      position: absolute;
      top: 20px;
      left: 30px;
      padding: 10px 20px;
      font-size: 16px;
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.4);
      color: white;
      text-decoration: none;
      border-radius: 30px;
      backdrop-filter: blur(10px);
      z-index: 999;
      transition: 0.3s;
    }

    .back-btn:hover {
      background: rgba(255, 255, 255, 0.3);
      color: #6a00ff;
    }
  </style>
</head>
<body>
<a href="landing.html" class="back-btn">← Back</a>

<div class="container" id="container">
  <!-- Sign Up -->
  <div class="form-container sign-up-container">
    <form id="signupForm" autocomplete="off">
      <input type="text" style="display:none"><input type="password" style="display:none">
      <h2>Create Account</h2>
      <input type="text" placeholder="Name" name="signup_name" autocomplete="off" required />
      <input type="email" placeholder="Email" name="signup_email" autocomplete="off" required />
      <input type="password" placeholder="Password" name="signup_password" autocomplete="new-password" required />
      <button type="submit">Sign Up</button>
    </form>
  </div>

  <!-- Sign In -->
  <div class="form-container sign-in-container">
    <form id="signinForm" autocomplete="off">
      <input type="text" style="display:none"><input type="password" style="display:none">
      <h2>Sign In</h2>
      <input type="email" placeholder="Email" name="signin_email" autocomplete="off" required />
      <input type="password" placeholder="Password" name="signin_password" autocomplete="new-password" required />
      <a href="forget-password.html">Forgot your password?</a>
      <button type="submit">Sign In</button>
    </form>
  </div>

  <!-- Overlay -->
  <div class="overlay-container">
    <div class="overlay">
      <div class="overlay-panel overlay-left">
        <h1>Welcome Back!</h1>
        <p>To keep connected, please login with your details</p>
        <button class="ghost" id="signIn">Sign In</button>
      </div>
      <div class="overlay-panel overlay-right">
        <h1>Hello, Friend!</h1>
        <p>Enter your personal details to sign up</p>
        <button class="ghost" id="signUp">Sign Up</button>
      </div>
    </div>
  </div>
</div>

<script>
  const container = document.getElementById('container');
  document.getElementById('signUp').addEventListener('click', () => {
    container.classList.add("right-panel-active");
  });
  document.getElementById('signIn').addEventListener('click', () => {
    container.classList.remove("right-panel-active");
  });

  // Clear inputs on load to avoid autofill
  window.onload = () => {
    document.querySelectorAll('input').forEach(input => input.value = '');
  };

  // Sign Up
  document.getElementById('signupForm').addEventListener('submit', function (e) {
    e.preventDefault();

    const name = this.querySelector('input[placeholder="Name"]').value;
    const email = this.querySelector('input[placeholder="Email"]').value;
    const password = this.querySelector('input[placeholder="Password"]').value;

    fetch("http://localhost:5000/student-signup", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name, email, password })
    })
    .then(res => res.json())
    .then(data => {
      alert(data.message);
      if (data.success) {
        window.location.href = "home.html";
      }
    })
    .catch(err => alert("Signup failed: " + err));
  });

  // Sign In
  document.getElementById('signinForm').addEventListener('submit', function (e) {
    e.preventDefault();

    const email = this.querySelector('input[placeholder="Email"]').value;
    const password = this.querySelector('input[placeholder="Password"]').value;

    fetch("http://localhost:5000/student-login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email, password })
    })
    .then(res => res.json())
    .then(data => {
      alert(data.message);
      if (data.success) {
        window.location.href = "home.html";
      }
    })
    .catch(err => alert("Login failed: " + err));
  });
</script>

</body>
</html>
