<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Donor Registration</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(135deg, #ff6ec4, #7873f5);
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: #fff;
      margin: 0;
    }

    .form-box {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
      padding: 40px;
      border-radius: 20px;
      width: 400px;
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.2);
    }

    .form-box h2 {
      text-align: center;
      margin-bottom: 25px;
      color: #fff;
    }

    .form-box .form-control,
    .form-box .form-select {
      background: rgba(255, 255, 255, 0.3);
      border: none;
      color: #fff;
      margin-bottom: 15px;
    }

    .form-control::placeholder {
      color: #ddd;
    }

    .btn-purple {
      background-color: #6a00ff;
      color: white;
      border-radius: 25px;
    }

    .btn-purple:hover {
      background-color: #4b00c9;
    }

    label {
      margin-top: 10px;
    }

    .form-check-label {
      margin-left: 8px;
      color: #eee;
    }

    .form-check {
      display: flex;
      align-items: center;
      margin-bottom: 20px;
    }

    .form-select {
      font-weight: 500;
      color: #000; /* default after selection */
    }

    .text-muted {
      color: #efebeb !important;  /* placeholder color */
    }
  </style>
</head>
<body>

  <div class="form-box">
    <h2>Donor Registration</h2>
    <form id="donorForm">
      <input type="text" id="name" class="form-control" placeholder="Name" required>
      <input type="text" id="regno" class="form-control" placeholder="Register Number" required>
      
      <select id="bloodgrp" class="form-select text-muted" required>
        <option value="" disabled selected>Select Blood Group</option>
        <option value="A+">A+</option>
        <option value="A-">A-</option>
        <option value="B+">B+</option>
        <option value="B-">B-</option>
        <option value="AB+">AB+</option>
        <option value="AB-">AB-</option>
        <option value="O+">O+</option>
        <option value="O-">O-</option>
      </select>

      <input type="text" id="dept" class="form-control" placeholder="Department" required>
      <input type="number" id="year" class="form-control" placeholder="Year of Passing" required>
      <input type="tel" id="phone" class="form-control" placeholder="Phone Number" required>

      <div class="form-check">
        <input type="checkbox" id="smsNotify" class="form-check-input">
        <label class="form-check-label" for="smsNotify">I want to receive SMS notifications</label>
      </div>

      <button type="submit" class="btn btn-purple w-100">Submit</button>
    </form>
  </div>

  <script>
    let donorLat = null, donorLng = null;

    // Get user location
    navigator.geolocation.getCurrentPosition(
      function(position) {
        donorLat = position.coords.latitude;
        donorLng = position.coords.longitude;
      },
      function(error) {
        alert("Please allow location access for accurate donor registration.");
      }
    );

    // Single submit handler for donor form
    document.getElementById("donorForm").addEventListener("submit", function(e) {
      e.preventDefault();

      const donorData = {
        name: document.getElementById("name").value,
        regno: document.getElementById("regno").value,
        bloodgrp: document.getElementById("bloodgrp").value,
        dept: document.getElementById("dept").value,
        year: parseInt(document.getElementById("year").value),
        phone: document.getElementById("phone").value,
        sms_notify: document.getElementById("smsNotify").checked,
        latitude: donorLat,
        longitude: donorLng
      };

      console.log("Submitting donor:", donorData);

      fetch("http://localhost:5000/register-donor", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(donorData)
      })
      .then(res => res.json())
      .then(data => {
        console.log("Server Response:", data);
        alert(data.message);
        if (data.success) {
          window.location.href = "home.html";
        }
      })
      .catch(err => {
        console.error("Fetch error:", err);
        alert("Submission failed: " + err);
      });
    });
  </script>
</body>
</html>
