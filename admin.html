<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Login | Blood Bank</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      height: 100vh;
      background: linear-gradient(135deg, #e47cba, #9794e1);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .glass-box {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(15px);
      border-radius: 25px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
      padding: 40px;
      width: 100%;
      max-width: 400px;
      color: #fff;
      animation: fadeSlideIn 1s ease forwards;
      opacity: 0;
      position: relative;
    }

    @keyframes fadeSlideIn {
      0% {
        opacity: 0;
        transform: translateY(50px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    h2 {
      font-weight: bold;
      text-align: center;
      margin-bottom: 30px;
    }

    .form-control {
      background: rgba(255, 255, 255, 0.15);
      border: none;
      color: #fff;
    }

    .form-control::placeholder {
      color: #ddd;
    }

    .form-control:focus {
      background: rgba(255, 255, 255, 0.25);
      box-shadow: none;
      color: #fff;
    }

    .btn-purple {
      background-color: #6a00ff;
      color: white;
      border-radius: 20px;
      font-weight: bold;
      padding: 10px;
      transition: background 0.3s;
    }

    .btn-purple:hover {
      background-color: #4b00c9;
    }

    .forgot-link {
      color: #eee;
      font-size: 0.9rem;
      display: inline-block;
      margin-top: 10px;
      text-align: right;
    }

    .forgot-link:hover {
      text-decoration: underline;
    }

    .back-btn {
      position: absolute;
      top: 20px;
      left: 30px;
      padding: 10px 20px;
      font-size: 16px;
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.4);
      color: white;
      text-decoration: none;
      border-radius: 30px;
      backdrop-filter: blur(10px);
      z-index: 999;
      transition: 0.3s;
    }

    .back-btn:hover {
      background: rgba(255, 255, 255, 0.3);
      color: #6a00ff;
    }
  </style>
</head>
<body>

  <!-- Back Button -->
  <a href="landing.html" class="back-btn">← Back</a>

  <!-- Admin Login Card -->
  <div class="glass-box">
    <h2>Admin Login</h2>
    <form id="adminLoginForm" autocomplete="off">
      <!-- dummy hidden field to prevent autofill -->
      <input type="text" style="display:none" aria-hidden="true">
      <input type="password" style="display:none" aria-hidden="true">

      <div class="mb-3">
        <input type="text" id="username" name="admin_user" class="form-control" placeholder="Username" autocomplete="off" required />
      </div>
      <div class="mb-3">
        <input type="password" id="password" name="admin_pass" class="form-control" placeholder="Password" autocomplete="new-password" required />
      </div>
      <div class="mb-3 text-end">
        <a href="admin-forgot-password.html" class="forgot-link">Forgot Password?</a>
      </div>
      <div class="d-grid">
        <button type="submit" class="btn btn-purple">Login</button>
      </div>
      <p id="message" style="text-align:center; margin-top:10px;"></p>
    </form>
  </div>

<script>
  // Clear previous autofill values when page loads
  window.addEventListener("load", () => {
    document.getElementById("username").value = "";
    document.getElementById("password").value = "";
  });

  document.getElementById("adminLoginForm").addEventListener("submit", function (e) {
    e.preventDefault();

    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value.trim();
    const messageEl = document.getElementById("message");

    fetch("http://localhost:5000/admin-login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username, password }),
    })
    .then(res => res.json())
    .then(data => {
      if (data.success) {
        messageEl.style.color = "lightgreen";
        messageEl.textContent = "Login successful! Redirecting...";
        setTimeout(() => {
          window.location.href = "home.html";
        }, 1500);
      } else {
        messageEl.style.color = "yellow";
        messageEl.textContent = data.message;
      }
    })
    .catch((err) => {
      console.error("Fetch error:", err);
      messageEl.style.color = "red";
      messageEl.textContent = "Could not connect to server.";
    });
  });
</script>

</body>
</html>
