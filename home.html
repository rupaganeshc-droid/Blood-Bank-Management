<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Blood Bank | Home</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet"/>
  <style>
    * {
      box-sizing: border-box;
    }
    .nav-link.active {
  color: #ff6ec4 !important;
  font-weight: 600;
}

.nav-link.active::after {
  width: 100%;
}


 body.transition-start {
  opacity: 0;
  filter: blur(5px);
  transition: all 0.3s ease;
}

body.transition-end {
  opacity: 1;
  filter: blur(0px);
  transition: all 0.6s ease;
}


    body, html {
      height: 100%;
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      overflow: hidden;
    }

    video.bg-video {
      position: fixed;
      top: 0;
      left: 0;
      min-width: 100%;
      min-height: 100%;
      object-fit: cover;
      z-index: -1;
      filter: brightness(0.5);
    }

    .navbar {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(12px);
      box-shadow: 0 4px 20px rgba(0,0,0,0.2);
    }

    .navbar-brand {
      font-size: 1.8rem;
      font-weight: bold;
      color: #fff !important;
      text-shadow: 1px 1px 4px #000;
    }

    .nav-link {
      position: relative;
      color: #fff !important;
      font-weight: 500;
      margin-right: 20px;
    }

    .nav-link::after {
      content: '';
      position: absolute;
      left: 0;
      bottom: -6px;
      width: 0;
      height: 2px;
      background: #ff6ec4;
      transition: width 0.3s ease;
    }

    .nav-link:hover::after {
      width: 100%;
    }

    .hero {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      flex-direction: column;
      color: #fff;
      padding-top: 80px;
    }

    .hero h1 {
      font-size: 3.5rem;
      font-weight: bold;
      background: linear-gradient(90deg, #ff6ec4, #7873f5);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: fadeInDown 1s ease;
    }

    .hero p {
      font-size: 1.2rem;
      color: #eee;
      max-width: 600px;
      margin-top: 15px;
      animation: fadeIn 2s ease;
    }

    .hero .btn {
      margin-top: 30px;
      padding: 12px 28px;
      border-radius: 30px;
      font-size: 1rem;
      font-weight: 500;
      background-color: #6a00ff;
      color: white;
      border: none;
      transition: background 0.3s;
      box-shadow: 0 0 15px rgba(106, 0, 255, 0.5);
      animation: fadeIn 2.5s ease;
    }

    .hero .btn:hover {
      background-color: #4b00c9;
    }

    @keyframes fadeInDown {
      from {
        transform: translateY(-40px);
        opacity: 0;
      }
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @media (max-width: 768px) {
      .hero h1 {
        font-size: 2.3rem;
      }
      .nav-link {
        margin-right: 10px;
      }
    }
  </style>
</head>
<body>

  <!-- 🎥 Background Video -->
  <video autoplay muted loop class="bg-video">
    <source src="blood-bg.mp4" type="video/mp4">
    Your browser does not support the video tag.
  </video>
<!-- Three Dots Menu (top-left corner) -->
<div style="position: absolute; top: 10px; left: 10px; z-index: 1000;">
  <button onclick="toggleMenu()" style="background: none; border: none; font-size: 24px;">
    &#8942;
  </button>

  <div id="menuPanel" style="display: none; background: white; border: 1px solid #ccc; padding: 15px; border-radius: 8px; width: 250px;">
    <h5>My Donor Info</h5>
    <div id="donorDetails">Loading...</div>
    <button class="btn btn-sm btn-primary mt-2" onclick="editDonorInfo()">Edit</button>
    <button class="btn btn-sm btn-danger mt-2" onclick="logout()">Logout</button>
  </div>
</div>

  <!-- 🔷 Modern Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark fixed-top">
    <div class="container-fluid px-4">
      <a class="navbar-brand" href="home.html"><i class="bi bi-droplet-fill"></i> Blood Bank</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
<ul class="navbar-nav">
  <li class="nav-item"><a class="nav-link" href="home.html">Home</a></li>
  <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
  <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
  <li class="nav-item student-hide"><a class="nav-link" href="donors.html">Donors</a></li>
  <li class="nav-item student-hide"><a class="nav-link" href="request.html">Request</a></li>
</ul>

      </div>
    </div>
  </nav>

  <!-- 💬 Hero Section -->
  <div class="hero">
    <h1>Donate Blood, Save Lives</h1>
    <p>Find donors, request blood, and support your community through our easy-to-use Blood Bank platform.</p>
    
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
  const role = localStorage.getItem("role");
const navItems = document.querySelectorAll(".navbar-nav .nav-item");

if (role === "student") {
  navItems.forEach((item, index) => {
    if (![0, 2].includes(index)) {
      item.style.display = "none";
    }
  });
} else if (role === "admin") {
  navItems.forEach(item => {
    item.style.display = "block";
  });
} else {
  window.location.href = "login.html";
}

  // Blur + fade in on page load
  document.body.classList.add('transition-start');
  window.addEventListener('DOMContentLoaded', () => {
    requestAnimationFrame(() => {
      document.body.classList.remove('transition-start');
      document.body.classList.add('transition-end');
    });
  });

  // Blur + fade out before navigating
  document.querySelectorAll('a').forEach(link => {
    const href = link.getAttribute('href');
    if (href && !href.startsWith('#') && !href.startsWith('javascript')) {
      link.addEventListener('click', function (e) {
        e.preventDefault();
        document.body.classList.remove('transition-end');
        document.body.classList.add('transition-start');
        setTimeout(() => {
          window.location.href = this.href;
        }, 600); // Match transition duration
      });
    }
  });
   // Highlight active nav link
  const navLinks = document.querySelectorAll('.nav-link');
  const currentPage = location.pathname.split("/").pop();

  navLinks.forEach(link => {
    const linkPage = link.getAttribute('href');
    if (linkPage === currentPage) {
      link.classList.add('active');
    }
  });
    const role = localStorage.getItem("role"); // role set during login

  if (role === "student") {
    document.querySelectorAll(".student-hide").forEach(item => {
      item.style.display = "none";
    });
  }
</script>
<script src="script.js"></script>

</body>
</html>
