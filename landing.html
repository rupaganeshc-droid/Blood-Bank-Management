<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Blood Bank - Choose Role</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet" />
  <style>
    body {
      background-image: url('clgpic.webp'); /* replace with your actual image file name/path */
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', sans-serif;
      color: white;
    }

    .landing-card {
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 50px 40px;
      text-align: center;
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.15);
      color: #fff;
      max-width: 420px;
      width: 100%;
      opacity: 0;
      transform: translateY(50px);
      animation: fadeSlideIn 1s ease forwards;
    }

    @keyframes fadeSlideIn {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .btn-role {
      background-color: #4b0082;
      color: white;
      border-radius: 50px;
      padding: 10px 30px;
      font-size: 1rem;
      transition: background 0.3s;
    }

    .btn-role:hover {
      background-color: #36006e;
    }

    .bi {
      font-size: 2rem;
    }

    h2 {
      font-weight: 600;
    }

    .subtitle {
      font-size: 1rem;
      color: #ddd;
      margin-bottom: 30px;
    }
  </style>
</head>
<body>

  <div class="landing-card">
    <div class="mb-3">
      <i class="bi bi-droplet-fill"></i>
      <h2 class="mt-2">Welcome to Blood Bank</h2>
      <p class="subtitle">Please choose your role to continue</p>
    </div>
    <div class="d-grid gap-3">
      <a href="student.html" class="btn btn-role"><i class="bi bi-person-fill"></i> Student</a>
      <a href="admin.html" class="btn btn-role"><i class="bi bi-person-gear"></i> Admin</a>
      <a href="hospital.html" class="btn btn-role"><i class="bi bi-hospital-fill"></i> Hospital</a>
    </div>
  </div>

</body>
</html>
