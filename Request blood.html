<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Request Blood</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet" />
  <style>
    body {
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Poppins', sans-serif;
      color: #fff;
    }

    .form-container {
      background: rgba(255, 255, 255, 0.2);
      padding: 40px;
      border-radius: 20px;
      backdrop-filter: blur(12px);
      box-shadow: 0 0 25px rgba(0,0,0,0.3);
      text-align: center;
      width: 380px;
      animation: fadeIn 1s ease-in-out;
    }

    h2 {
      font-weight: 700;
      margin-bottom: 30px;
    }

    label {
      font-weight: 500;
    }

    .btn-submit {
      background: linear-gradient(90deg, #ff416c, #ff4b2b);
      color: white;
      border: none;
      width: 100%;
      padding: 12px;
      font-size: 1.1rem;
      border-radius: 10px;
      transition: transform 0.2s ease, box-shadow 0.3s ease;
    }

    .btn-submit:hover {
      transform: translateY(-3px);
      box-shadow: 0px 10px 20px rgba(0,0,0,0.3);
    }

    .btn-back {
      background: linear-gradient(90deg, #667eea, #764ba2);
      color: white;
      border: none;
      width: 100%;
      padding: 10px;
      font-size: 1rem;
      border-radius: 10px;
      margin-top: 15px;
      transition: transform 0.2s ease, box-shadow 0.3s ease;
    }

    .btn-back:hover {
      transform: translateY(-3px);
      box-shadow: 0px 10px 20px rgba(0,0,0,0.3);
    }

    @keyframes fadeIn {
      from {opacity: 0; transform: translateY(20px);}
      to {opacity: 1; transform: translateY(0);}
    }

    input, select {
      color: black;
    }
  </style>
</head>
<body>

  <div class="form-container">
    <i class="bi bi-droplet-half" style="font-size: 3rem;"></i>
    <h2>Request Blood</h2>
    <form id="bloodRequestForm" onsubmit="return submitRequest(event)">
      <div class="mb-3 text-start">
        <label for="patientName" class="form-label">Patient Name</label>
        <input type="text" class="form-control" id="patientName" placeholder="Enter Patient Name" required />
      </div>

      <div class="mb-3 text-start">
        <label for="units" class="form-label">How many Units</label>
        <input type="number" class="form-control" id="units" placeholder="Enter No. of Units" required />
      </div>

      <div class="mb-3 text-start">
        <label for="bloodGroup" class="form-label">Blood Group</label>
        <select class="form-select" id="bloodGroup" required>
          <option value="" disabled selected>Select Blood Group</option>
          <option>A+</option>
          <option>A-</option>
          <option>B+</option>
          <option>B-</option>
          <option>AB+</option>
          <option>AB-</option>
          <option>O+</option>
          <option>O-</option>
        </select>
      </div>

      <button type="submit" class="btn-submit">Submit Request</button>
    </form>

    <button class="btn-back" onclick="goBack()">
      <i class="bi bi-arrow-left-circle"></i> Back to Verification
    </button>
  </div>

  <script>
    function submitRequest(event) {
      event.preventDefault();

      const name = document.getElementById('patientName').value.trim();
      const units = document.getElementById('units').value.trim();
      const group = document.getElementById('bloodGroup').value;

      if (name && units && group) {
        alert(`Blood Request Submitted:\nPatient: ${name}\nUnits: ${units}\nGroup: ${group}`);
        // You can connect this to your backend API here.
      }
    }

    function goBack() {
      window.location.href = "Verification.html";
    }
  </script>

</body>
</html>
